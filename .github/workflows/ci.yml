name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install deps (仅测试所需，不含重型研究库)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx numpy websocket-client 'ccxt>=4.5,<5'

      - name: Compile check
        run: |
          python -m compileall -q -x 'lib/|node_modules/|\.git/' .
          echo "✅ py_compile 全部通过"

      - name: AI repository contract
        run: |
          python tools/ai_repo_check.py
          python tests/test_ai_repo_check.py

      - name: Layer check (code graph)
        run: python tools/code_graph.py --check

      - name: Parameter centralization check
        run: python tools/params_lint.py

      - name: Test isolation check
        run: python tools/test_isolation_lint.py

      - name: Fix regression guards
        run: python tools/fix_guard.py

      - name: Full offline test suite (27 scripts)
        env:
          CRYPTO_AGENT_MODE: paper
          PYTHONPATH: "lib:."
        run: |
          test_files=(tests/test_*.py)
          if [ "${#test_files[@]}" -ne 27 ]; then
            echo "Expected 27 test scripts, found ${#test_files[@]}"
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            test_name="$(basename "$test_file" .py)"
            echo "Running $test_file"
            CRYPTO_AGENT_DB="$RUNNER_TEMP/${test_name}.db" \
            CRYPTO_AGENT_EVENTS_FILE="$RUNNER_TEMP/${test_name}.events.jsonl" \
              python "$test_file"
          done
